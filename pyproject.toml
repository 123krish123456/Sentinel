[project]
name = "axiom"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "typer>=0.12", "pyyaml", "duckdb", "pandas", "numpy", "scipy", "anthropic", "httpx", "pyarrow", "matplotlib", "tabulate"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
axiom = "axiom.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["axiom*"]

[tool.setuptools.package-data]
"axiom.agents.prompts" = ["*.md"]

[tool.ruff]
line-length = 100
